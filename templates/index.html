<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎬 Movie Recommendation System</h1>

        <form method="POST">

            <input
                type="text"
                name="movie"
                placeholder="Enter movie name"
                required
            >

            <button type="submit">
                Recommend
            </button>

        </form>
    
    <div class="error-box">
    <p>Please enter the full name of the movie correctly</p>
</div>

        <div class="results">

            {% for movie in recommendations %}

                <div class="movie-card">
                    {{ movie }}
                </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
